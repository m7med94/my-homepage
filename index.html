<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensors Hub | Real-time Monitoring</title>
    <meta
      name="description"
      content="Sensors Hub provides real-time monitoring and analytics for all your connected sensors and devices."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand" aria-label="Sensors Hub home">
          <span class="brand-mark">S</span>
          <span>Sensors Hub</span>
        </div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#overview">Overview</a>
          <a href="#status">Status</a>
          <a href="#alerts">Alerts</a>
        </nav>
        <div class="nav-actions">
          <div class="status-indicator" id="systemStatus">
            <span class="status-dot active"></span>
            <span>Connected</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="dashboard" id="overview">
        <div class="container">
          <div class="dashboard-header">
            <div>
              <h1>Sensor Monitoring Dashboard</h1>
              <p class="subtitle">Real-time data from your connected devices</p>
            </div>
            <div class="time-display" id="timeDisplay">--:--:--</div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Active Sensors</span>
              <strong class="stat-value" id="activeSensors">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Avg Temperature</span>
              <strong class="stat-value" id="avgTemp">0°C</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">System Status</span>
              <strong class="stat-value good" id="systemHealth">Optimal</strong>
            </div>
          </div>

          <div class="sensors-grid" id="sensorsGrid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <div class="brand footer-brand">
          <span class="brand-mark">S</span>
          <span>Sensors Hub</span>
        </div>
        <p>© <span id="year"></span> Sensors Hub. Real-time monitoring system.</p>
        <div class="footer-links">
          <a href="#overview">Dashboard</a>
          <a href="#status">Status</a>
          <a href="#alerts">Alerts</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
